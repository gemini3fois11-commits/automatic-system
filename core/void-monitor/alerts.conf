# Void Monitor — Alert Policy

# Action on violation: "log" (default), "halt" (emergency shutdown)
on_violation=log

# Check interval in seconds (default 5)
check_interval=5

# Whitelist — these mount points are allowed even if writable
# (comma-separated)
whitelist_mounts=/run,/dev,/dev/pts,/dev/shm,/sys,/proc
