# Invariant Gate — Security Policy
# 1 = enforce, 0 = skip

# Disable swap (prevents RAM content spilling to disk)
block_swap=1

# Disable core dumps (prevents memory forensics via crash files)
block_coredump=1

# Restrict ptrace to prevent process injection
restrict_ptrace=1

# Strip SUID bits from binaries (reduce privilege escalation surface)
disable_suid=0
